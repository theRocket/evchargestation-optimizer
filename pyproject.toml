[tool.poetry]
name = "evcharge-opt"
version = "0.2.0"
description = "National EV Corridor Optimization Engine & Cloud-Native Geospatial Pipeline"
authors = ["Ryan Rickerts"]
readme = "README.md"
packages = [{include = "evcharge_opt", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
duckdb = "^1.1.0"
polars = "^1.9.0"
pyarrow = "^17.0.0"
h3 = "^4.1.0"
numpy = "^2.1.0"
scipy = "^1.14.0"
pulp = "^2.9.0"
httpx = "^0.27.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
typer = ">=0.15.0"
rich = "^13.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.poetry.scripts]
evopt = "evcharge_opt.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
